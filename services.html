<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLOWLY · Services</title>
<style>
body{margin:0;background:#090909;color:#eee;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:34px 20px}
.kicker{font-size:10px;letter-spacing:.16em;color:#777}
h1{margin:7px 0 4px;font-size:28px}.sub{color:#888;font-size:12px}
.panel{margin-top:20px;padding:18px;border:1px solid #242424;border-radius:16px;background:#0e0e0e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{font-size:10px;color:#888;display:block;margin-bottom:5px}
input{width:100%;box-sizing:border-box;background:#101010;color:#eee;border:1px solid #292929;border-radius:9px;padding:10px}
button{border:1px solid #333;background:#eee;color:#111;border-radius:9px;padding:10px 14px;cursor:pointer}
button.secondary{background:#151515;color:#eee}
.actions{display:flex;gap:8px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid #222}
.name{font-weight:700;font-size:13px}.meta{font-size:10px;color:#777;margin-top:4px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>

<style id="flowly-premium-services-v1">
:root{--line:rgba(255,255,255,.08);--purple:#8d5cff;--purple2:#6b42df;--gold:#d3a45f;--muted:#918d9e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -10%,rgba(141,92,255,.16),transparent 30%),linear-gradient(#07070b,#090910);color:#f7f5fb;font-family:Inter,"Noto Sans Thai",Arial,sans-serif}
.app{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr)}
.side{height:100vh;position:sticky;top:0;padding:23px 15px;background:rgba(8,8,13,.94);border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:11px;padding:8px 10px 25px;text-decoration:none;color:#fff;font-size:18px;letter-spacing:.13em;font-weight:800}.logo:before{content:"F";width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),#b579ff);box-shadow:0 0 25px rgba(141,92,255,.32);font-size:15px;letter-spacing:0}.logo i{font-style:normal;color:var(--gold)}
.section{padding:16px 11px 7px;font-size:9px;letter-spacing:.18em;color:#615e6b}.nav{display:flex;padding:10px 11px;margin:3px 0;border:1px solid transparent;border-radius:11px;text-decoration:none;color:#aaa6b4;font-size:12px}.nav:hover{background:rgba(255,255,255,.04);color:#fff}.nav.active{background:linear-gradient(90deg,rgba(141,92,255,.2),rgba(141,92,255,.04));border-color:rgba(141,92,255,.2);color:#fff}
.main{min-width:0}.top{height:69px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 27px;border-bottom:1px solid var(--line);background:rgba(7,7,11,.72);backdrop-filter:blur(16px)}.crumb,.user{font-size:11px;color:#777382}.user{display:flex;align-items:center;gap:11px;color:#ddd}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#191822;border:1px solid var(--line);color:var(--gold);font-weight:800}
.wrap{max-width:1440px;margin:auto;padding:27px}.hero{padding:23px 25px;border:1px solid rgba(141,92,255,.18);border-radius:19px;background:linear-gradient(115deg,rgba(141,92,255,.15),rgba(18,17,27,.92) 60%,rgba(211,164,95,.05));box-shadow:0 16px 45px rgba(0,0,0,.22)}.kicker{font-size:9px;letter-spacing:.18em;color:var(--gold);font-weight:800}h1{margin:7px 0 4px;font-size:29px}.sub{color:var(--muted);font-size:11px}
.panel{margin-top:16px;padding:19px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,rgba(19,19,29,.94),rgba(12,12,19,.96));box-shadow:0 12px 35px rgba(0,0,0,.18)}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}label{font-size:10px;color:#aaa6b4}input{background:#0b0b12;color:#eee;border:1px solid var(--line);border-radius:10px;padding:11px}input:focus{outline:none;border-color:rgba(141,92,255,.55);box-shadow:0 0 0 3px rgba(141,92,255,.08)}
button{border:0;background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;box-shadow:0 9px 24px rgba(141,92,255,.16)}button.secondary{background:#181721;color:#aaa6b4;border:1px solid var(--line);box-shadow:none}.actions{display:flex;gap:8px;margin-top:12px}.row{padding:14px 12px;border-top:1px solid var(--line);border-radius:11px}.row:hover{background:rgba(141,92,255,.045)}.name{font-size:12px}.meta{font-size:10px;color:var(--muted)}
@media(max-width:900px){.app{grid-template-columns:205px minmax(0,1fr)}}
@media(max-width:680px){.app{display:block}.side{display:none}.wrap{padding:17px}.grid{grid-template-columns:1fr}}
</style>

<script src="flowly-config.js"></script></head>
<body>
<div class="app">
<aside class="side">
<a class="logo" href="index.html">FLOW<i>LY</i></a>
<div class="section">WORKSPACE</div>
<a class="nav" href="dashboard.html">⌂ &nbsp; Dashboard</a>
<a class="nav" href="booking.html">◷ &nbsp; Booking</a>
<a class="nav" href="customers.html">◯ &nbsp; Customers</a>
<a class="nav active" href="services.html">◇ &nbsp; Services</a>
<div class="section">INSIGHTS</div>
<a class="nav" href="business-data.html">▥ &nbsp; Business Data</a>
<a class="nav" href="ai-assistant.html">✦ &nbsp; AI Assistant</a>
<div class="section">SYSTEM</div>
<a class="nav" href="settings.html">⚙ &nbsp; Settings</a>
</aside>
<main class="main">
<header class="top"><span class="crumb">Workspace / Services</span><div class="user"><span>FLOWLY Business</span><div class="avatar">F</div></div></header>
<div class="wrap">
<div class="hero">
<div class="kicker">FLOWLY / SERVICES</div>
<h1>บริการ</h1>
<div class="sub">จัดการรายการบริการ ราคา และระยะเวลา</div></div>

<section class="panel">
  <div class="kicker">ADD SERVICE</div>
  <div class="grid" style="margin-top:12px">
    <div><label>ชื่อบริการ</label><input id="sName" placeholder="เช่น บริการมาตรฐาน"></div>
    <div><label>ระยะเวลา (นาที)</label><input id="sDuration" type="number" min="1" placeholder="60"></div>
    <div><label>ราคา</label><input id="sPrice" type="number" min="0" step="0.01" placeholder="800"></div>
  </div>
  <div class="actions"><button id="add">เพิ่มบริการ</button><span id="msg" aria-live="polite" class="meta"></span></div>
</section>

<section class="panel">
  <div class="kicker">SERVICE LIST</div>
  <div id="list" style="margin-top:5px"><div class="meta">กำลังโหลด...</div></div>
</section>
</div></main></div>
<script>
(function(){
 const API=window.FLOWLY_API_BASE||"";
 const list=document.getElementById("list"),msg=document.getElementById("msg");
 const esc=v=>String(v??"").replace(/[<>&"]/g,"");
 let rows=[];
 async function call(path,opt={}){const r=await fetch(API+path,{credentials:"include",headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b?.error?.message||"เกิดข้อผิดพลาด");return b.data}
 async function load(){try{rows=await call("/api/v1/services");list.innerHTML=rows.map(x=>`<div class="row"><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.duration_minutes)} นาที · ฿${Number(x.price).toLocaleString("th-TH",{minimumFractionDigits:2})} · ${x.active?"เปิดใช้งาน":"ปิดใช้งาน"}</div></div><div class="actions"><button class="secondary" data-edit="${esc(x.id)}">แก้ไข</button><button class="secondary" data-del="${esc(x.id)}">ลบ</button></div></div>`).join("")||'<div class="meta">ยังไม่มีบริการ</div>'}catch(e){list.innerHTML='<div class="meta">ต้องเข้าสู่ระบบและเชื่อม API ก่อน</div>'}}
 document.getElementById("add").onclick=async()=>{const name=sName.value.trim(),duration=Number(sDuration.value),price=Number(sPrice.value);if(!name||!Number.isInteger(duration)||duration<1||!Number.isFinite(price)||price<0){msg.textContent="กรอกข้อมูลให้ครบและถูกต้อง";return}try{await call("/api/v1/services",{method:"POST",body:JSON.stringify({name,duration_minutes:duration,price})});sName.value=sDuration.value=sPrice.value="";msg.textContent="เพิ่มบริการแล้ว";load()}catch(e){msg.textContent=e.message}}
 list.onclick=async e=>{const edit=e.target.closest("[data-edit]"),del=e.target.closest("[data-del]");if(edit){const x=rows.find(r=>r.id===edit.dataset.edit);if(!x)return;const name=prompt("ชื่อบริการ",x.name);if(name===null)return;const duration=Number(prompt("ระยะเวลา (นาที)",x.duration_minutes));if(!Number.isInteger(duration)||duration<1)return;const price=Number(prompt("ราคา",x.price));if(!Number.isFinite(price)||price<0)return;try{await call("/api/v1/services/"+encodeURIComponent(x.id),{method:"PUT",body:JSON.stringify({name,duration_minutes:duration,price,active:x.active})});load()}catch(err){alert(err.message)}}if(del){const x=rows.find(r=>r.id===del.dataset.del);if(!x)return;if(!confirm("ยืนยันลบบริการนี้?"))return;try{await call("/api/v1/services/"+encodeURIComponent(x.id),{method:"DELETE"});load()}catch(err){alert(err.message)}}};
 load();
})();
</script>
</body></html>
