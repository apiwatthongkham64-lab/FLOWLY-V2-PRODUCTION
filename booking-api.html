<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLOWLY · Booking API</title>
<style>body{margin:0;background:#090909;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:34px 20px}.panel{margin-top:18px;padding:18px;border:1px solid #242424;border-radius:16px;background:#0e0e0e}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{font-size:10px;color:#888}select,input,button{box-sizing:border-box;width:100%;padding:10px;border-radius:9px;border:1px solid #292929;background:#111;color:#eee}button{background:#eee;color:#111;cursor:pointer}.row{padding:12px 0;border-top:1px solid #222;font-size:12px}.meta{font-size:10px;color:#777}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><script src="flowly-config.js"></script></head><body><div class="wrap"><div class="meta">FLOWLY / BOOKING API</div><h1>สร้างการจอง</h1>
<section class="panel"><div class="grid"><div><label>ลูกค้า</label><select id="customer"></select></div><div><label>บริการ</label><select id="service"></select></div><div><label>วันที่</label><input id="date" type="date"></div><div><label>เวลา</label><input id="time" type="time"></div></div><button id="save" style="margin-top:12px">สร้างการจอง</button><div id="msg" class="meta" style="margin-top:8px"></div></section>
<section class="panel"><div class="meta">BOOKING LIST</div><div id="list" style="margin-top:6px"></div></section></div>
<script>
(async function(){
const API=window.FLOWLY_API_BASE||"";const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[<>&"]/g,"");
async function call(p,o={}){const r=await fetch(API+p,{credentials:"include",headers:{"Content-Type":"application/json",...(o.headers||{})},...o});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b?.error?.message||"เกิดข้อผิดพลาด");return b.data}
try{
 const [cs,ss,bs]=await Promise.all([call("/api/v1/customers"),call("/api/v1/services"),call("/api/v1/bookings")]);
 $("customer").innerHTML=cs.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
 $("service").innerHTML=ss.filter(x=>x.active).map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · ฿${Number(x.price).toLocaleString("th-TH")}</option>`).join("");
 $("list").innerHTML=bs.map(x=>`<div class="row"><b>${esc(x.customer_name||x.customer_id)}</b> · ${esc(x.service_name||x.service_id)}<br><span class="meta">${esc(x.booking_date)} ${esc(x.booking_time)} · </span><select data-status-booking="${esc(x.id)}" style="width:auto;padding:5px"><option ${x.status==="pending"?"selected":""}>pending</option><option ${x.status==="confirmed"?"selected":""}>confirmed</option><option ${x.status==="completed"?"selected":""}>completed</option><option ${x.status==="cancelled"?"selected":""}>cancelled</option></select></div>`).join("")||'<div class="meta">ยังไม่มีการจอง</div>';
        document.querySelectorAll("[data-status-booking]").forEach(el=>el.onchange=async()=>{try{await call("/api/v1/bookings/"+encodeURIComponent(el.dataset.statusBooking)+"/status",{method:"PATCH",body:JSON.stringify({status:el.value})});}catch(e){alert(e.message);location.reload()}});
 $("save").onclick=async()=>{try{await call("/api/v1/bookings",{method:"POST",body:JSON.stringify({customer_id:$("customer").value,service_id:$("service").value,booking_date:$("date").value,booking_time:$("time").value})});$("msg").textContent="สร้างการจองแล้ว";location.reload()}catch(e){$("msg").textContent=e.message}};
}catch(e){$("msg").textContent=e.message}
})();
</script></body></html>
